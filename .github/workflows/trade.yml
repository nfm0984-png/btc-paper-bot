name: Paper Trade

on:
  schedule:
    # Hourly kickoff. The job itself loops bot.py every 5 minutes for ~50 minutes.
    # (GitHub throttles */5 crons on this repo to roughly hourly, so a 5-minute
    # cron is not a reliable 5-minute loop.)
    - cron: "2 * * * *"
    # Backup kickoff: GitHub dropped the 08:02 and 09:02 UTC scheduled runs on Nov 27,
    # idling the paper book for over an hour. The loop stops 8 min before the next :02
    # and the concurrency group queues any overlap.
    - cron: "32 * * * *"
  workflow_dispatch:
    inputs:
      single_shot:
        description: "Run a single tick instead of the ~50-minute 5-minute loop"
        required: false
        type: boolean
        default: false
      ticks:
        description: "Number of 5-minute ticks (ignored when single_shot is true). Default 10 (~45–50 minutes)."
        required: false
        type: string
        default: "10"

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 56
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 5-minute paper-trade loop
        env:
          SINGLE_SHOT: ${{ github.event_name == 'workflow_dispatch' && inputs.single_shot || 'false' }}
          TICKS: ${{ github.event_name == 'workflow_dispatch' && inputs.ticks || '10' }}
        run: bash .github/scripts/trade_loop.sh
