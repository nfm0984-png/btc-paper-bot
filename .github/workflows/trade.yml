name: Paper Trade

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Kalshi 15-min paper bot
        run: python3 bot.py

      - name: Commit updated paper book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/backtest.json docs/data.json
          if git diff --staged --quiet; then
            echo "No paper-book changes to commit."
          else
            git commit -m "chore: update Kalshi 15m paper book $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
